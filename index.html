<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валентинка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Caveat', cursive;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #c2185b;
            overflow: hidden;
            position: relative;
        }

        .section {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 90%;
            z-index: 2;
            position: relative;
        }

        .active {
            display: flex;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            margin: 10px 0 25px;
            color: #d81b60;
            text-shadow: 2px 2px 8px rgba(255,105,180,0.6);
        }

        button {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 16px 40px;
            margin: 12px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px rgba(216,27,96,0.3);
            position: relative;
            overflow: hidden;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff4081, #f50057);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #ec407a, #d81b60);
        }

        button::before {
            content: "❤️ ";
            font-size: 1.4rem;
        }

        button:hover {
            transform: translateY(-6px) scale(1.08);
            box-shadow: 0 15px 35px rgba(216,27,96,0.5);
            background: linear-gradient(45deg, #f50057, #ff4081);
        }

        button:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Модальное окно */
        #modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: linear-gradient(135deg, #fff1f6, #ffebee);
            padding: 35px 25px;
            border-radius: 30px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(216,27,96,0.4);
            border: 3px solid #ff80ab;
        }

        .modal-content p {
            font-size: 1.8rem;
            margin: 0 0 25px;
            color: #c2185b;
        }

        /* Финальная секция */
        #congrats {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1519741497674-281450b6b30b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            color: white;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            padding: 40px;
            box-sizing: border-box;
            font-size: 1.6rem;
            line-height: 1.6;
            overflow: hidden;
        }

        #congrats .text-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 30px;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.18);
        }

        /* Анимация летающих сердец и поцелуев */
        .floating-emoji {
            position: absolute;
            font-size: 2.5rem;
            pointer-events: none;
            user-select: none;
            animation: float 12s linear infinite;
            z-index: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-15vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Начальная секция -->
    <div id="start" class="section active">
        <img src="https://i.pinimg.com/originals/1a/90/ec/1a90ec1bedf4a14f5c8eda916ebf7c7b.gif" alt="GIF с письмом">
        <h1>У меня для тебя письмо...</h1>
        <button class="btn-primary" onclick="openLetter()">Открыть</button>
        <button class="btn-secondary" onclick="showModal()">Не надо</button>
    </div>

    <!-- Секция с поздравлением Валентина -->
    <div id="valentine" class="section">
        <img src="https://www.wordsjustforyou.com/wp-content/uploads/2023/01/Pink-Happy-Valentines-Day-Gif-wj4u7729012023.gif" alt="GIF С Днём Святого Валентина">
        <h1>С Днём Святого Валентина!</h1>
        <button class="btn-primary" onclick="continueToCongrats()">Продолжить</button>
    </div>

    <!-- Финальная секция с поздравлением -->
    <div id="congrats" class="section">
        <div class="text-container">
            <p>Дорогая [Имя],<br><br>
            В этот особенный день хочу сказать, как сильно я тебя люблю. Ты — свет в моей жизни, и каждый момент с тобой — настоящее счастье. Будь всегда такой же прекрасной!<br><br>
            С любовью, [Твоё имя] ❤️</p>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal">
        <div class="modal-content">
            <p>Ну пожалуйста открой 🥺</p>
            <button class="btn-primary" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        function showModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function openLetter() {
            document.getElementById('start').classList.remove('active');
            document.getElementById('valentine').classList.add('active');
        }

        function continueToCongrats() {
            document.getElementById('valentine').classList.remove('active');
            document.getElementById('congrats').classList.add('active');
            startFloatingEmojis();
        }

        function startFloatingEmojis() {
            const emojis = ['❤️', '💋', '❤️', '💋', '❤️'];
            const congrats = document.getElementById('congrats');

            setInterval(() => {
                const emoji = document.createElement('div');
                emoji.className = 'floating-emoji';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Случайная позиция слева
                emoji.style.left = Math.random() * 100 + 'vw';
                // Случайная задержка анимации
                emoji.style.animationDelay = Math.random() * 5 + 's';
                // Случайный размер
                const size = (Math.random() * 1.5 + 1.5) + 'rem';
                emoji.style.fontSize = size;
                
                congrats.appendChild(emoji);

                // Удаляем через 15 секунд
                setTimeout(() => {
                    emoji.remove();
                }, 15000);
            }, 800); // каждые 0.8 секунды новый элемент
        }
    </script>

</body>
</html>
