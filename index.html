<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background: linear-gradient(-45deg, #ff758c, #ff7eb3, #ff5f9e, #ffc3d8);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Сердечки */
.heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp linear forwards;
    opacity: 0.8;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 0;
    }
    10% { opacity: 1; }
    100% {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
    }
}

/* Карточки */
.section {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 95%;
    max-width: 420px;
    padding: 40px 25px;
    border-radius: 30px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.15);
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    animation: fadeIn 0.6s ease;
    z-index: 2;
}

.active {
    display: flex;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

img {
    width: 180px;
    margin-bottom: 25px;
    border-radius: 20px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: white;
    margin-bottom: 25px;
}

/* Кнопки */
.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
}

button {
    padding: 14px 30px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: 0.3s ease;
}

.btn-primary {
    background: white;
    color: #ff4d88;
}

.btn-primary:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.btn-secondary {
    background: rgba(255,255,255,0.3);
    color: white;
}

.btn-secondary:hover {
    background: rgba(255,255,255,0.5);
}

/* Финальный экран */
#congrats {
    position: fixed;
    inset: 0;
    border-radius: 0;
    background: rgba(255,105,180,0.85);
    padding: 40px;
    color: white;
    font-size: 1.1rem;
    line-height: 1.6;
}

/* Модалка */
#modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 3;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    max-width: 300px;
}

.modal-content p {
    margin-bottom: 20px;
    font-weight: 500;
}
</style>
</head>

<body>

<div id="start" class="section active">
    <img src="https://i.pinimg.com/originals/1a/90/ec/1a90ec1bedf4a14f5c8eda916ebf7c7b.gif">
    <h1>У меня для тебя кое-что есть…</h1>
    <div class="buttons">
        <button class="btn-primary" onclick="openLetter()">Открыть</button>
        <button class="btn-secondary" onclick="showModal()">Не сейчас</button>
    </div>
</div>

<div id="valentine" class="section">
    <img src="https://www.wordsjustforyou.com/wp-content/uploads/2023/01/Pink-Happy-Valentines-Day-Gif-wj4u7729012023.gif">
    <h1>С Днём Святого Валентина ❤️</h1>
    <div class="buttons">
        <button class="btn-primary" onclick="continueToCongrats()">Продолжить</button>
    </div>
</div>

<div id="congrats" class="section">
    <h1>Для тебя ❤️</h1>
    <p>
        Дорогая [Имя],<br><br>
        Ты — самое тёплое, что есть в моей жизни.  
        Спасибо за твою улыбку и каждый момент рядом.  
        Я тебя очень люблю ❤️<br><br>
        С любовью, [Твоё имя]
    </p>
</div>

<div id="modal">
    <div class="modal-content">
        <p>Ну пожалуйста, открой 🥺</p>
        <button class="btn-primary" onclick="closeModal()">Ладно</button>
    </div>
</div>

<script>
function showModal() {
    document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

function openLetter() {
    document.getElementById('start').classList.remove('active');
    document.getElementById('valentine').classList.add('active');
}

function continueToCongrats() {
    document.getElementById('valentine').classList.remove('active');
    document.getElementById('congrats').classList.add('active');
}

/* Генерация сердечек */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
